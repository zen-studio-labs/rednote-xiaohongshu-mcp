name: Feature request
description: A tool, field or client you would like to see.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: The question you want your assistant to answer, or the data you need.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today?
